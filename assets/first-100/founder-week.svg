<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Newsreader, Georgia, serif">
  <rect width="600" height="400" rx="12" fill="#f4efe3"/>
  <g font-size="13" fill="#2b2321" text-anchor="middle">
    <text x="130" y="48">Mon</text><text x="225" y="48">Tue</text><text x="320" y="48">Wed</text><text x="415" y="48">Thu</text><text x="510" y="48">Fri</text>
  </g>
  <g font-size="11" fill="#6b6460" text-anchor="end">
    <text x="70" y="88">9:00</text><text x="70" y="148">11:00</text><text x="70" y="208">14:00</text><text x="70" y="268">16:00</text><text x="70" y="328">17:30</text>
  </g>
  <g stroke="#2b2321" stroke-opacity=".1"><path d="M82 64H560M82 124H560M82 184H560M82 244H560M82 304H560M82 360H560"/></g>
  <!-- morning outreach every day -->
  <g fill="#1d3b33">
    <rect x="88" y="68" width="84" height="44" rx="6"/><rect x="183" y="68" width="84" height="44" rx="6"/><rect x="278" y="68" width="84" height="44" rx="6"/><rect x="373" y="68" width="84" height="44" rx="6"/><rect x="468" y="68" width="84" height="44" rx="6"/>
  </g>
  <g fill="#f4efe3" font-size="11" text-anchor="middle">
    <text x="130" y="94">Outreach</text><text x="225" y="94">Outreach</text><text x="320" y="94">Outreach</text><text x="415" y="94">Outreach</text><text x="510" y="94">Outreach</text>
  </g>
  <!-- calls -->
  <g fill="#f2b544">
    <rect x="183" y="190" width="84" height="48" rx="6"/><rect x="373" y="190" width="84" height="48" rx="6"/><rect x="88" y="250" width="84" height="40" rx="6"/>
  </g>
  <g fill="#2b2321" font-size="11" text-anchor="middle">
    <text x="225" y="218">Customer calls</text><text x="415" y="218">Customer calls</text><text x="130" y="274">Lead call</text>
  </g>
  <!-- weekly review -->
  <rect x="468" y="310" width="84" height="40" rx="6" fill="none" stroke="#1d3b33" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="510" y="334" fill="#1d3b33" font-size="11" text-anchor="middle" font-weight="700">30-min review</text>
  <g font-size="12" fill="#2b2321">
    <rect x="88" y="372" width="12" height="12" rx="2" fill="#1d3b33"/><text x="106" y="382">1 hour, every morning</text>
    <rect x="250" y="372" width="12" height="12" rx="2" fill="#f2b544"/><text x="268" y="382">calls, a few hours a week</text>
    <rect x="426" y="372" width="12" height="12" rx="2" fill="none" stroke="#1d3b33" stroke-dasharray="3 2"/><text x="444" y="382">same day weekly</text>
  </g>
</svg>
