<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'IBM Plex Mono', monospace, sans-serif">
  <rect width="700" height="360" rx="12" fill="#faf8f5"/>
  <rect x="18" y="18" width="664" height="324" rx="8" fill="none" stroke="#e2ddd5" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="52" fill="#132a24" font-size="14" font-weight="700" letter-spacing="0.05em">THE 90-DAY REALISTIC EXECUTION SPRINT</text>
  <text x="40" y="72" fill="#66706b" font-size="11">From zero to 100 paying customers through 3 focused phases</text>

  <!-- 3 Phase Cards -->
  <g transform="translate(40, 95)">
    <!-- Phase 1 -->
    <rect width="190" height="200" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#ecfdf5"/>
    <text x="49" y="29" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">DAYS 1–30</text>
    <text x="14" y="60" fill="#132a24" font-size="13" font-weight="700">Discovery & 1st 10</text>
    <line x1="14" y1="74" x2="176" y2="74" stroke="#f0ece4" stroke-width="1"/>
    <text x="14" y="94" fill="#334155" font-size="10">• 20+ live conversations</text>
    <text x="14" y="112" fill="#334155" font-size="10">• 1 hr/day manual outreach</text>
    <text x="14" y="130" fill="#334155" font-size="10">• Zero product pitching</text>
    <text x="14" y="148" fill="#334155" font-size="10">• Close 5–10 paying users</text>
    <rect x="14" y="165" width="162" height="22" rx="3" fill="#ecfdf5"/>
    <text x="95" y="180" fill="#059669" font-size="9" font-weight="600" text-anchor="middle">Target: 10 Customers</text>

    <!-- Phase 2 -->
    <rect x="215" width="190" height="200" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="229" y="14" width="70" height="22" rx="4" fill="#f0f9ff"/>
    <text x="264" y="29" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">DAYS 30–60</text>
    <text x="229" y="60" fill="#132a24" font-size="13" font-weight="700">Refine & Proof</text>
    <line x1="229" y1="74" x2="391" y2="74" stroke="#f0ece4" stroke-width="1"/>
    <text x="229" y="94" fill="#334155" font-size="10">• Hone pitch with buyer words</text>
    <text x="229" y="112" fill="#334155" font-size="10">• Collect early case proof</text>
    <text x="229" y="130" fill="#334155" font-size="10">• Onboarding standardization</text>
    <text x="229" y="148" fill="#334155" font-size="10">• Activate referral gift loop</text>
    <rect x="229" y="165" width="162" height="22" rx="3" fill="#f0f9ff"/>
    <text x="310" y="180" fill="#0284c7" font-size="9" font-weight="600" text-anchor="middle">Target: 50 Customers</text>

    <!-- Phase 3 -->
    <rect x="430" width="190" height="200" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="444" y="14" width="70" height="22" rx="4" fill="#fef3c7"/>
    <text x="479" y="29" fill="#d97706" font-size="10" font-weight="700" text-anchor="middle">DAYS 60–90</text>
    <text x="444" y="60" fill="#132a24" font-size="13" font-weight="700">Scale 1 Channel</text>
    <line x1="444" y1="74" x2="606" y2="74" stroke="#f0ece4" stroke-width="1"/>
    <text x="444" y="94" fill="#334155" font-size="10">• Double down on winner</text>
    <text x="444" y="112" fill="#334155" font-size="10">• Automate scheduling/ops</text>
    <text x="444" y="130" fill="#334155" font-size="10">• Keep sales call personal</text>
    <text x="444" y="148" fill="#334155" font-size="10">• Document founder manual</text>
    <rect x="444" y="165" width="162" height="22" rx="3" fill="#fef3c7"/>
    <text x="525" y="180" fill="#d97706" font-size="9" font-weight="600" text-anchor="middle">Target: 100 Customers</text>
  </g>
</svg>
