<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'IBM Plex Mono', monospace, sans-serif">
  <rect width="700" height="360" rx="12" fill="#132a24"/>
  <rect x="18" y="18" width="664" height="324" rx="8" fill="none" stroke="#24453c" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="52" fill="#2dd4bf" font-size="13" font-weight="600" letter-spacing="0.1em">THE 3 DIAGNOSTIC FOUNDER QUESTIONS</text>
  <text x="40" y="72" fill="#94a3b8" font-size="11">How to separate polite compliments from paying early adopters</text>

  <!-- Flow Boxes -->
  <g transform="translate(40, 95)">
    <!-- Box 1 -->
    <rect width="190" height="180" rx="8" fill="#1b3830" stroke="#2dd4bf" stroke-width="1"/>
    <rect x="16" y="16" width="28" height="20" rx="4" fill="#2dd4bf"/>
    <text x="30" y="30" fill="#132a24" font-size="11" font-weight="700" text-anchor="middle">Q1</text>
    <text x="16" y="60" fill="#ffffff" font-size="11" font-weight="600">"Would you pay for this today?"</text>
    <line x1="16" y1="85" x2="174" y2="85" stroke="#24453c" stroke-width="1"/>
    <text x="16" y="105" fill="#e5a93b" font-size="10" font-weight="600">WHY IT WORKS:</text>
    <text x="16" y="125" fill="#cbd5e1" font-size="10">A compliment is free.</text>
    <text x="16" y="142" fill="#cbd5e1" font-size="10">A commitment to buy</text>
    <text x="16" y="159" fill="#cbd5e1" font-size="10">costs real money.</text>

    <!-- Arrow 1 -->
    <path d="M 200,90 L 218,90" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
    <path d="M 213,85 L 220,90 L 213,95" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>

    <!-- Box 2 -->
    <rect x="225" width="190" height="180" rx="8" fill="#1b3830" stroke="#2dd4bf" stroke-width="1"/>
    <rect x="241" y="16" width="28" height="20" rx="4" fill="#2dd4bf"/>
    <text x="255" y="30" fill="#132a24" font-size="11" font-weight="700" text-anchor="middle">Q2</text>
    <text x="241" y="60" fill="#ffffff" font-size="11" font-weight="600">"What do you use instead now?"</text>
    <line x1="241" y1="85" x2="399" y2="85" stroke="#24453c" stroke-width="1"/>
    <text x="241" y="105" fill="#e5a93b" font-size="10" font-weight="600">WHY IT WORKS:</text>
    <text x="241" y="125" fill="#cbd5e1" font-size="10">No current workaround</text>
    <text x="241" y="142" fill="#cbd5e1" font-size="10">usually signals no</text>
    <text x="241" y="159" fill="#cbd5e1" font-size="10">real painful need.</text>

    <!-- Arrow 2 -->
    <path d="M 425,90 L 443,90" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
    <path d="M 438,85 L 445,90 L 438,95" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>

    <!-- Box 3 -->
    <rect x="450" width="190" height="180" rx="8" fill="#1b3830" stroke="#2dd4bf" stroke-width="1"/>
    <rect x="466" y="16" width="28" height="20" rx="4" fill="#2dd4bf"/>
    <text x="480" y="30" fill="#132a24" font-size="11" font-weight="700" text-anchor="middle">Q3</text>
    <text x="466" y="60" fill="#ffffff" font-size="11" font-weight="600">"Who else should I speak with?"</text>
    <line x1="466" y1="85" x2="624" y2="85" stroke="#24453c" stroke-width="1"/>
    <text x="466" y="105" fill="#e5a93b" font-size="10" font-weight="600">WHY IT WORKS:</text>
    <text x="466" y="125" fill="#cbd5e1" font-size="10">Genuine buyers introduce</text>
    <text x="466" y="142" fill="#cbd5e1" font-size="10">peers. Polite contacts</text>
    <text x="466" y="159" fill="#cbd5e1" font-size="10">make excuses.</text>
  </g>
</svg>
