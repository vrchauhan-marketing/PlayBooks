<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'IBM Plex Mono', monospace, sans-serif">
  <rect width="700" height="380" rx="12" fill="#132a24"/>
  <rect x="18" y="18" width="664" height="344" rx="8" fill="none" stroke="#24453c" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="40" y="52" fill="#2dd4bf" font-size="13" font-weight="600" letter-spacing="0.1em">THE UNREASONABLE POWER OF COMPOUNDING</text>
  <text x="40" y="74" fill="#a7f3d0" font-size="11" opacity="0.8">100 early adopters growing 10% weekly becomes ~14,200 customers in 1 year</text>

  <!-- Curve Chart Area -->
  <g transform="translate(40, 95)">
    <!-- Grid lines -->
    <line x1="0" y1="210" x2="380" y2="210" stroke="#1f3e35" stroke-width="1"/>
    <line x1="0" y1="150" x2="380" y2="150" stroke="#1f3e35" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="90" x2="380" y2="90" stroke="#1f3e35" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="30" x2="380" y2="30" stroke="#1f3e35" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Y labels -->
    <text x="-10" y="214" fill="#6ee7b7" font-size="9" text-anchor="end">100</text>
    <text x="-10" y="154" fill="#6ee7b7" font-size="9" text-anchor="end">1,000</text>
    <text x="-10" y="94" fill="#6ee7b7" font-size="9" text-anchor="end">5,000</text>
    <text x="-10" y="34" fill="#6ee7b7" font-size="9" text-anchor="end">14,000</text>

    <!-- X labels -->
    <text x="0" y="230" fill="#6ee7b7" font-size="9">Wk 1</text>
    <text x="120" y="230" fill="#6ee7b7" font-size="9">Wk 18</text>
    <text x="250" y="230" fill="#6ee7b7" font-size="9">Wk 36</text>
    <text x="380" y="230" fill="#6ee7b7" font-size="9" text-anchor="end">Wk 52</text>

    <!-- Curve gradient area -->
    <path d="M 0,210 Q 180,205 280,140 T 380,30 L 380,210 Z" fill="url(#growthGrad)" opacity="0.25"/>
    
    <!-- Path -->
    <path d="M 0,210 Q 180,205 280,140 T 380,30" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Highlight points -->
    <circle cx="0" cy="210" r="5" fill="#2dd4bf" stroke="#132a24" stroke-width="2"/>
    <circle cx="380" cy="30" r="6" fill="#e5a93b" stroke="#132a24" stroke-width="2"/>
  </g>

  <!-- Right side cards -->
  <g transform="translate(460, 95)">
    <!-- Card 1 -->
    <rect width="200" height="95" rx="6" fill="#1b3830" stroke="#2dd4bf" stroke-width="1"/>
    <text x="16" y="28" fill="#e5a93b" font-size="11" font-weight="700">WEEK 1 TO 8</text>
    <text x="16" y="48" fill="#f5f7f2" font-size="11">Feels slow & manual</text>
    <text x="16" y="68" fill="#94a3b8" font-size="10">1 hr/day talking to people</text>
    <text x="16" y="83" fill="#6ee7b7" font-size="10">Capturing exact language</text>

    <!-- Card 2 -->
    <rect y="115" width="200" height="95" rx="6" fill="#1b3830" stroke="#34d399" stroke-width="1"/>
    <text x="16" y="143" fill="#34d399" font-size="11" font-weight="700">THE TURNING POINT</text>
    <text x="16" y="163" fill="#f5f7f2" font-size="11">Word of mouth ignites</text>
    <text x="16" y="183" fill="#94a3b8" font-size="10">Customers refer others</text>
    <text x="16" y="198" fill="#6ee7b7" font-size="10">Unscalable habits payoff</text>
  </g>

  <defs>
    <linearGradient id="growthGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
